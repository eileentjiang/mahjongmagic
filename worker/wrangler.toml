name = "mahjong-magic"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SessionRoom"

[[durable_objects.bindings]]
name = "STATS"
class_name = "PhotoStats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PhotoStats"]

# Photos are read by Cloudflare Workers AI (free daily allowance). Change the model here.
[ai]
binding = "AI"

[vars]
# Gemini reads photos when the GEMINI_API_KEY secret is set; Workers AI is the backup.
GEMINI_MODEL = "gemini-2.5-flash"
PHOTO_MODEL = "@cf/moonshotai/kimi-k2.6"
