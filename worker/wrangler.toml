name = "mahjong-magic"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

# Photos are read by Cloudflare Workers AI (free daily allowance). Change the model here.
[ai]
binding = "AI"

[vars]
PHOTO_MODEL = "@cf/moonshotai/kimi-k2.6"
